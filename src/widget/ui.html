<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Preview Widget</title>
    <style>
      body {
        margin: 0;
        font-family: Inter, sans-serif;
        background: #f7f7f8;
        color: #1e1e1f;
      }

      .root {
        padding: 14px;
        display: grid;
        gap: 10px;
      }

      .label {
        font-size: 12px;
        font-weight: 600;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #d4d4d8;
        background: #fff;
        font-size: 12px;
      }

      button {
        border: 0;
        border-radius: 8px;
        background: #111827;
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        padding: 10px;
        cursor: pointer;
      }

      .secondary {
        background: #e4e4e7;
        color: #111827;
      }

      .danger {
        background: #fee2e2;
        color: #991b1b;
      }

      .status {
        font-size: 11px;
        color: #0f172a;
      }

      .status.error {
        color: #b91c1c;
      }

      .status.loading {
        color: #0c4a6e;
      }

      .status.success {
        color: #166534;
      }

      .details {
        font-size: 10px;
        color: #7c2d12;
        word-break: break-word;
        display: none;
      }

      .details[data-open="true"] {
        display: block;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .auth-panel {
        display: none;
        border: 1px solid #fca5a5;
        border-radius: 8px;
        background: #fff1f2;
        padding: 10px;
        gap: 8px;
      }

      .auth-panel[data-open="true"] {
        display: grid;
      }

      .auth-title {
        font-size: 11px;
        font-weight: 700;
        color: #9f1239;
      }

      .auth-copy {
        font-size: 11px;
        color: #7f1d1d;
      }

      .auth-meta {
        font-size: 10px;
        color: #9a3412;
        word-break: break-word;
      }

      .link-button {
        border: 0;
        background: transparent;
        padding: 0;
        font-size: 11px;
        text-decoration: underline;
        color: #0f172a;
        cursor: pointer;
        text-align: left;
      }

      .result-meta {
        font-size: 10px;
        color: #475569;
      }

      .progress-line {
        font-size: 10px;
        color: #334155;
      }

      .progress-track {
        width: 100%;
        height: 6px;
        border-radius: 999px;
        background: #e2e8f0;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        background: #0f766e;
        transition: width 160ms linear;
      }

      .preview-panel {
        display: grid;
        gap: 6px;
      }

      .preview-text {
        margin: 0;
        padding: 8px;
        border: 1px solid #d4d4d8;
        border-radius: 8px;
        background: #ffffff;
        font-size: 10px;
        color: #0f172a;
        max-height: 360px;
        min-height: 180px;
        overflow: auto;
        resize: vertical;
      }

      .preview-empty {
        color: #64748b;
        white-space: pre-wrap;
      }

      .preview-md-heading {
        margin: 0 0 8px 0;
        font-size: 13px;
        font-weight: 700;
        color: #0f172a;
      }

      .preview-md-paragraph {
        margin: 0 0 8px 0;
        font-size: 11px;
        line-height: 1.4;
        white-space: pre-wrap;
      }

      .preview-md-list {
        margin: 0 0 8px 16px;
        padding: 0;
        font-size: 11px;
        line-height: 1.4;
      }

      .preview-md-code {
        margin: 0 0 8px 0;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #d4d4d8;
        background: #f8fafc;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
        white-space: pre-wrap;
      }

      .preview-inline-code {
        padding: 1px 4px;
        border-radius: 4px;
        border: 1px solid #d4d4d8;
        background: #f1f5f9;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
      }

      .preview-md-link {
        color: #1d4ed8;
        text-decoration: underline;
      }

      .preview-md-table-wrap {
        margin: 0 0 8px 0;
        overflow-x: auto;
      }

      .preview-md-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 10px;
        line-height: 1.4;
      }

      .preview-md-table th,
      .preview-md-table td {
        border: 0.5px solid #cbd5e1;
        padding: 4px 6px;
        text-align: left;
        vertical-align: top;
      }

      .preview-md-table th {
        background: #f1f5f9;
        font-weight: 700;
      }

      .preview-md-divider {
        border: 0;
        border-top: 0.5px solid #cbd5e1;
        margin: 10px 0;
      }
    </style>
  </head>
  <body>
    <form class="root" id="url-form">
      <label class="label" for="url-input">GitHub file URL</label>
      <input id="url-input" placeholder="https://github.com/org/repo/blob/main/README.md" required />
      <div class="actions">
        <button type="submit">Create preview</button>
        <button class="secondary" id="refresh-button" type="button">Refresh preview</button>
      </div>
      <div class="status" id="status-line">Ready</div>
      <div class="result-meta" id="result-line">State: idle</div>
      <div class="progress-line" id="progress-line">Sync progress: 0%</div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="preview-panel">
        <div class="label">Preview</div>
        <div class="preview-text" id="preview-text"></div>
      </div>
      <button class="link-button" id="toggle-details-button" type="button">Show details</button>
      <div class="details" id="details-line" data-open="false"></div>
      <div class="auth-panel" id="auth-panel" data-open="false">
        <div class="auth-title">Private file requires PAT</div>
        <div class="auth-copy" id="auth-copy"></div>
        <div class="auth-meta" id="auth-meta"></div>
        <label class="label" for="pat-input">Personal access token</label>
        <input id="pat-input" type="password" placeholder="ghp_xxx or github_pat_xxx" />
        <div class="actions">
          <button class="secondary" id="save-pat-button" type="button">Guardar PAT y reintentar</button>
          <button class="danger" id="forget-pat-button" type="button">Olvidar PAT fichero</button>
        </div>
      </div>
    </form>

    <script>
      parent.postMessage(
        {
          pluginMessage: {
            type: "ui-ready",
          },
        },
        "*"
      );

      window.addEventListener("beforeunload", () => {
        parent.postMessage(
          {
            pluginMessage: {
              type: "ui-closed",
            },
          },
          "*"
        );
      });

      const form = document.getElementById("url-form");
      const input = document.getElementById("url-input");
      const patInput = document.getElementById("pat-input");
      const submitButton = form.querySelector("button[type='submit']");
      const refreshButton = document.getElementById("refresh-button");
      const savePatButton = document.getElementById("save-pat-button");
      const forgetPatButton = document.getElementById("forget-pat-button");
      const statusLine = document.getElementById("status-line");
      const resultLine = document.getElementById("result-line");
      const toggleDetailsButton = document.getElementById("toggle-details-button");
      const detailsLine = document.getElementById("details-line");
      const authPanel = document.getElementById("auth-panel");
      const authCopy = document.getElementById("auth-copy");
      const authMeta = document.getElementById("auth-meta");
      const previewText = document.getElementById("preview-text");
      const progressLine = document.getElementById("progress-line");
      const progressFill = document.getElementById("progress-fill");
      let activeWidgetId = "active-widget";
      let activeAuthContext = null;
      let detailsOpen = false;
      let syncProgress = 0;

      const AUTH_MESSAGES = {
        MISSING_PAT:
          "El fichero que intentas visualizar es privado. Crea o pega un personal access token para continuar.",
        EXPIRED_PAT: "Tu personal access token es invalido o ha expirado.",
        CURRENT_PAT: "Tu personal access token no tiene permisos/scope suficiente.",
      };

      function updateDetailsVisibility() {
        detailsLine.dataset.open = detailsOpen ? "true" : "false";
        toggleDetailsButton.textContent = detailsOpen ? "Hide details" : "Show details";
      }

      function setStatus(level, message, details = "") {
        statusLine.textContent = message || "Ready";
        statusLine.className = `status ${level || ""}`.trim();
        detailsLine.textContent = details || "";
        if (!details) {
          detailsOpen = false;
        }
        updateDetailsVisibility();

        const isLoading = level === "loading";
        submitButton.disabled = isLoading;
        refreshButton.disabled = isLoading;
      }

      function setLastResult(lastResult, syncState) {
        const safe = lastResult && typeof lastResult === "object" ? lastResult : {};
        const status = safe.status || syncState || "idle";
        const mode = safe.mode || "manual";
        const message = safe.message ? ` · ${safe.message}` : "";
        resultLine.textContent = `State: ${status} (${mode})${message}`;
      }

      function setSyncProgress(rawPercent) {
        const percent = Number.isFinite(Number(rawPercent))
          ? Math.max(0, Math.min(100, Math.round(Number(rawPercent))))
          : 0;
        syncProgress = percent;
        progressLine.textContent = `Sync progress: ${percent}%`;
        progressFill.style.width = `${percent}%`;
      }

      function clearNodeChildren(node) {
        while (node.firstChild) {
          node.removeChild(node.firstChild);
        }
      }

      function appendPreviewNode(tagName, className, text) {
        const node = document.createElement(tagName);
        if (className) node.className = className;
        node.textContent = typeof text === "string" ? text : "";
        return node;
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function formatInlineMarkdownToHtml(value) {
        let html = escapeHtml(value);
        html = html.replace(
          /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
          '<a class="preview-md-link" href="$2" target="_blank" rel="noreferrer">$1</a>'
        );
        html = html.replace(/`([^`]+)`/g, '<code class="preview-inline-code">$1</code>');
        html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        html = html.replace(/__([^_]+)__/g, "<strong>$1</strong>");
        html = html.replace(/(^|[^\*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
        html = html.replace(/(^|[^_])_([^_\n]+)_/g, "$1<em>$2</em>");
        html = html.replace(/\n/g, "<br/>");
        return html;
      }

      function appendMarkdownNode(tagName, className, text) {
        const node = document.createElement(tagName);
        if (className) node.className = className;
        node.innerHTML = formatInlineMarkdownToHtml(text);
        return node;
      }

      function parseMarkdownTableRow(line) {
        const normalized = String(line || "").trim().replace(/^\|/, "").replace(/\|$/, "");
        return normalized.split("|").map((cell) => cell.trim());
      }

      function buildTableNode(content) {
        const rawLines = String(content || "")
          .split(/\r?\n/)
          .map((line) => line.trim())
          .filter(Boolean);
        if (rawLines.length < 2) {
          return appendPreviewNode("pre", "preview-md-code", String(content || ""));
        }

        const header = parseMarkdownTableRow(rawLines[0]);
        const rows = rawLines.slice(2).map(parseMarkdownTableRow);
        const colCount = Math.max(1, header.length);

        const wrapper = document.createElement("div");
        wrapper.className = "preview-md-table-wrap";
        const table = document.createElement("table");
        table.className = "preview-md-table";
        const thead = document.createElement("thead");
        const headRow = document.createElement("tr");
        for (let i = 0; i < colCount; i += 1) {
          const th = document.createElement("th");
          th.innerHTML = formatInlineMarkdownToHtml(header[i] || "");
          headRow.appendChild(th);
        }
        thead.appendChild(headRow);
        table.appendChild(thead);

        const tbody = document.createElement("tbody");
        for (const rowCells of rows) {
          const tr = document.createElement("tr");
          for (let i = 0; i < colCount; i += 1) {
            const td = document.createElement("td");
            td.innerHTML = formatInlineMarkdownToHtml(rowCells[i] || "");
            tr.appendChild(td);
          }
          tbody.appendChild(tr);
        }
        table.appendChild(tbody);
        wrapper.appendChild(table);
        return wrapper;
      }

      function normalizeListItem(item) {
        if (item && typeof item === "object") {
          return {
            content: String(item.content || ""),
            depth: Math.max(1, Number(item.depth || 1)),
          };
        }
        return {
          content: String(item || ""),
          depth: 1,
        };
      }

      function buildNestedListNode(items, ordered) {
        const listTag = ordered ? "ol" : "ul";
        const root = document.createElement(listTag);
        root.className = "preview-md-list";
        const stack = [{ depth: 1, list: root }];

        for (const rawItem of items) {
          const current = normalizeListItem(rawItem);
          let targetDepth = Math.max(1, current.depth);

          while (stack.length > targetDepth) {
            stack.pop();
          }

          while (stack.length < targetDepth) {
            const parent = stack[stack.length - 1].list;
            let parentLi = parent.lastElementChild;
            if (!parentLi) {
              parentLi = document.createElement("li");
              parent.appendChild(parentLi);
            }

            const nested = document.createElement(listTag);
            nested.className = "preview-md-list";
            parentLi.appendChild(nested);
            stack.push({ depth: stack.length + 1, list: nested });
          }

          stack[stack.length - 1].list.appendChild(
            appendMarkdownNode("li", "", current.content)
          );
        }

        return root;
      }

      function setPreviewContent(payload) {
        const summary =
          typeof payload?.previewSummary === "string" ? payload.previewSummary.trim() : "";
        const previewKind =
          typeof payload?.previewKind === "string" ? payload.previewKind : "text";
        const previewBlocks = Array.isArray(payload?.previewBlocks) ? payload.previewBlocks : [];

        clearNodeChildren(previewText);

        if (previewKind === "markdown" && previewBlocks.length > 0) {
          const fragment = document.createDocumentFragment();

          for (const block of previewBlocks) {
            const type = typeof block?.type === "string" ? block.type : "text";

            if (type === "heading") {
              fragment.appendChild(
                appendMarkdownNode(
                  "p",
                  "preview-md-heading",
                  String(block?.content || "")
                )
              );
              continue;
            }

            if (type === "paragraph") {
              fragment.appendChild(
                appendMarkdownNode(
                  "p",
                  "preview-md-paragraph",
                  String(block?.content || "")
                )
              );
              continue;
            }

            if (type === "list" && Array.isArray(block?.items)) {
              fragment.appendChild(buildNestedListNode(block.items, Boolean(block.ordered)));
              continue;
            }

            if (type === "divider") {
              const hr = document.createElement("hr");
              hr.className = "preview-md-divider";
              fragment.appendChild(hr);
              continue;
            }

            if (type === "table") {
              fragment.appendChild(buildTableNode(block?.content || ""));
              continue;
            }

            if (type === "code" || type === "text" || type === "mermaid") {
              fragment.appendChild(
                appendPreviewNode("pre", "preview-md-code", String(block?.content || ""))
              );
              continue;
            }

            fragment.appendChild(
              appendPreviewNode(
                "p",
                "preview-md-paragraph",
                String(block?.content || "")
              )
            );
          }

          previewText.appendChild(fragment);
          return;
        }

        previewText.appendChild(
          appendPreviewNode("pre", "preview-empty", summary || "No preview yet.")
        );
      }

      function setAuthPanel(open, payload = null) {
        if (!open || !payload || typeof payload.sourceKey !== "string") {
          activeAuthContext = null;
          authPanel.dataset.open = "false";
          authCopy.textContent = "";
          authMeta.textContent = "";
          patInput.value = "";
          savePatButton.disabled = false;
          forgetPatButton.disabled = false;
          return;
        }

        activeAuthContext = payload;
        authPanel.dataset.open = "true";
        authCopy.textContent =
          payload.message || AUTH_MESSAGES[payload.code] || AUTH_MESSAGES.MISSING_PAT;
        authMeta.textContent = `sourceKey: ${payload.sourceKey}`;
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        setStatus("loading", "Syncing...");

        parent.postMessage(
          {
            pluginMessage: {
              type: "create-preview",
              url: input.value,
            },
          },
          "*"
        );
      });

      refreshButton.addEventListener("click", () => {
        setStatus("loading", "Syncing...");
        parent.postMessage(
          {
            pluginMessage: {
              type: "refresh-preview",
              widgetId: activeWidgetId,
            },
          },
          "*"
        );
      });

      toggleDetailsButton.addEventListener("click", () => {
        detailsOpen = !detailsOpen;
        updateDetailsVisibility();
      });

      savePatButton.addEventListener("click", () => {
        if (!activeAuthContext || typeof activeAuthContext.sourceKey !== "string") {
          setStatus("error", "No hay sourceKey para guardar PAT.");
          return;
        }

        const token = patInput.value.trim();
        if (!token) {
          setStatus("error", "Introduce un PAT valido para continuar.");
          return;
        }

        setStatus("loading", "Reintentando con PAT...");
        parent.postMessage(
          {
            pluginMessage: {
              type: "submit-pat",
              sourceKey: activeAuthContext.sourceKey,
              token,
            },
          },
          "*"
        );
      });

      forgetPatButton.addEventListener("click", () => {
        if (!activeAuthContext || typeof activeAuthContext.sourceKey !== "string") {
          setStatus("error", "No hay sourceKey para olvidar PAT.");
          return;
        }

        parent.postMessage(
          {
            pluginMessage: {
              type: "forget-pat",
              sourceKey: activeAuthContext.sourceKey,
            },
          },
          "*"
        );
      });

      window.onmessage = (event) => {
        const payload = event.data && event.data.pluginMessage;
        if (!payload || typeof payload.type !== "string") {
          return;
        }

        if (payload.type === "widget-context") {
          if (typeof payload.lastUrl === "string" && payload.lastUrl.length > 0) {
            input.value = payload.lastUrl;
          }

          if (typeof payload.widgetId === "string" && payload.widgetId.length > 0) {
            activeWidgetId = payload.widgetId;
          }

          if (typeof payload.status === "string" && payload.status.length > 0) {
            setStatus("", payload.status);
          }
          setLastResult(payload.lastResult, payload.syncState);
          setSyncProgress(payload.progressPercent);
          setPreviewContent(payload);

          if (payload.authContext && typeof payload.authContext === "object") {
            setAuthPanel(true, payload.authContext);
          } else {
            setAuthPanel(false);
          }
          return;
        }

        if (payload.type === "runtime-status") {
          setStatus(payload.level, payload.message, payload.details);
          setLastResult(payload.lastResult, payload.syncState);
          if (payload.level === "success" && payload.progressPercent == null) {
            setSyncProgress(100);
          } else if (payload.level === "error" && payload.progressPercent == null) {
            setSyncProgress(100);
          } else {
            setSyncProgress(payload.progressPercent);
          }
          setPreviewContent(payload);
          if (payload.authRequired && typeof payload.sourceKey === "string") {
            setAuthPanel(true, payload);
          } else if (payload.level === "success") {
            setAuthPanel(false);
          }
        }
      };

      setPreviewContent({});
      updateDetailsVisibility();
    </script>
  </body>
</html>
