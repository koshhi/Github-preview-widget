<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Preview Widget</title>
    <style>
      :root {
        color-scheme: light dark;
        --gh-fg-default: #1f2328;
        --gh-fg-muted: #59636e;
        --gh-fg-subtle: #656d76;
        --gh-bg-canvas: #ffffff;
        --gh-bg-subtle: #f6f8fa;
        --gh-bg-code-inline: rgba(175, 184, 193, 0.2);
        --gh-border-default: #d0d7de;
        --gh-border-muted: #d8dee4;
        --gh-accent-fg: #0969da;
        --gh-danger-fg: #cf222e;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --gh-fg-default: #e6edf3;
          --gh-fg-muted: #9da7b3;
          --gh-fg-subtle: #7d8590;
          --gh-bg-canvas: #0d1117;
          --gh-bg-subtle: #151b23;
          --gh-bg-code-inline: rgba(110, 118, 129, 0.4);
          --gh-border-default: #30363d;
          --gh-border-muted: #21262d;
          --gh-accent-fg: #2f81f7;
          --gh-danger-fg: #ff7b72;
        }
      }

      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        background: var(--gh-bg-subtle);
        color: var(--gh-fg-default);
      }

      .root {
        padding: 14px;
        display: grid;
        gap: 10px;
      }

      .label {
        font-size: 12px;
        font-weight: 600;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid var(--gh-border-default);
        background: var(--gh-bg-canvas);
        color: var(--gh-fg-default);
        font-size: 12px;
      }

      button {
        border: 0;
        border-radius: 8px;
        background: #1f2328;
        color: #ffffff;
        font-size: 12px;
        font-weight: 600;
        padding: 10px;
        cursor: pointer;
      }

      .secondary {
        background: var(--gh-bg-canvas);
        color: var(--gh-fg-default);
        border: 1px solid var(--gh-border-default);
      }

      .danger {
        background: rgba(207, 34, 46, 0.12);
        color: var(--gh-danger-fg);
        border: 1px solid rgba(207, 34, 46, 0.38);
      }

      .status {
        font-size: 11px;
        color: var(--gh-fg-default);
      }

      .status.error {
        color: var(--gh-danger-fg);
      }

      .status.loading {
        color: var(--gh-accent-fg);
      }

      .status.success {
        color: #1a7f37;
      }

      .details {
        font-size: 10px;
        color: var(--gh-fg-subtle);
        word-break: break-word;
        display: none;
      }

      .details[data-open="true"] {
        display: block;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .auth-panel {
        display: none;
        border: 1px solid rgba(207, 34, 46, 0.5);
        border-radius: 8px;
        background: rgba(207, 34, 46, 0.08);
        padding: 10px;
        gap: 8px;
      }

      .auth-panel[data-open="true"] {
        display: grid;
      }

      .auth-title {
        font-size: 11px;
        font-weight: 700;
        color: var(--gh-danger-fg);
      }

      .auth-copy {
        font-size: 11px;
        color: var(--gh-danger-fg);
      }

      .auth-meta {
        font-size: 10px;
        color: var(--gh-fg-subtle);
        word-break: break-word;
      }

      .link-button {
        border: 0;
        background: transparent;
        padding: 0;
        font-size: 11px;
        text-decoration: underline;
        color: var(--gh-accent-fg);
        cursor: pointer;
        text-align: left;
      }

      .result-meta {
        font-size: 10px;
        color: var(--gh-fg-subtle);
      }

      .progress-line {
        font-size: 10px;
        color: var(--gh-fg-subtle);
      }

      .progress-track {
        width: 100%;
        height: 6px;
        border-radius: 999px;
        background: var(--gh-border-muted);
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        background: var(--gh-accent-fg);
        transition: width 160ms linear;
      }

      .preview-panel {
        display: grid;
        gap: 6px;
      }

      .preview-text {
        margin: 0;
        padding: 16px;
        border: 1px solid var(--gh-border-default);
        border-radius: 6px;
        background: var(--gh-bg-canvas);
        color: var(--gh-fg-default);
        max-height: 360px;
        min-height: 180px;
        overflow: auto;
        resize: vertical;
      }

      .preview-empty {
        color: var(--gh-fg-subtle);
        white-space: pre-wrap;
        margin: 0;
      }

      .markdown-body {
        font-size: 16px;
        line-height: 1.5;
        word-wrap: break-word;
      }

      .markdown-body h1,
      .markdown-body h2,
      .markdown-body h3,
      .markdown-body h4,
      .markdown-body h5,
      .markdown-body h6 {
        margin-top: 24px;
        margin-bottom: 16px;
        font-weight: 600;
        line-height: 1.25;
      }

      .markdown-body h1,
      .markdown-body h2 {
        padding-bottom: 0.3em;
        border-bottom: 1px solid var(--gh-border-muted);
      }

      .markdown-body h1 {
        font-size: 2em;
      }

      .markdown-body h2 {
        font-size: 1.5em;
      }

      .markdown-body h3 {
        font-size: 1.25em;
      }

      .markdown-body h4 {
        font-size: 1em;
      }

      .markdown-body h5 {
        font-size: 0.875em;
      }

      .markdown-body h6 {
        font-size: 0.85em;
        color: var(--gh-fg-muted);
      }

      .markdown-body p,
      .markdown-body ul,
      .markdown-body ol,
      .markdown-body blockquote,
      .markdown-body pre,
      .markdown-body table,
      .markdown-body details {
        margin-top: 0;
        margin-bottom: 16px;
      }

      .markdown-body ul,
      .markdown-body ol {
        padding-left: 2em;
      }

      .markdown-body li {
        margin-top: 0.25em;
      }

      .markdown-body hr {
        height: 0.25em;
        padding: 0;
        margin: 24px 0;
        background-color: var(--gh-border-muted);
        border: 0;
      }

      .markdown-body a {
        color: var(--gh-accent-fg);
        text-decoration: none;
      }

      .markdown-body a:hover {
        text-decoration: underline;
      }

      .markdown-body blockquote {
        padding: 0 1em;
        color: var(--gh-fg-muted);
        border-left: 0.25em solid var(--gh-border-default);
      }

      .markdown-body code {
        padding: 0.2em 0.4em;
        margin: 0;
        font-size: 85%;
        white-space: break-spaces;
        background-color: var(--gh-bg-code-inline);
        border-radius: 6px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      .markdown-body pre {
        padding: 16px;
        overflow: auto;
        font-size: 85%;
        line-height: 1.45;
        border-radius: 6px;
        border: 1px solid var(--gh-border-default);
        background: var(--gh-bg-subtle);
      }

      .markdown-body pre code {
        padding: 0;
        border-radius: 0;
        background: transparent;
        white-space: pre;
      }

      .preview-md-heading {
        margin-top: 24px;
        margin-bottom: 16px;
      }

      .preview-md-paragraph {
        margin: 0 0 16px 0;
        white-space: pre-line;
      }

      .preview-md-list {
        margin: 0 0 16px 0;
      }

      .preview-md-blockquote {
        margin: 0 0 16px 0;
      }

      .preview-md-task-item {
        list-style: none;
        margin-left: -24px;
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }

      .preview-md-task-box {
        width: 16px;
        height: 16px;
        margin-top: 2px;
        accent-color: var(--gh-accent-fg);
      }

      .preview-md-task-label {
        display: block;
        flex: 1;
      }

      .preview-md-code {
        margin: 0 0 16px 0;
      }

      .preview-inline-code {
        font-size: 85%;
      }

      .preview-md-link {
        color: var(--gh-accent-fg);
      }

      .preview-md-table-wrap {
        margin: 0 0 16px 0;
        overflow-x: auto;
      }

      .preview-md-table {
        width: 100%;
        border-collapse: collapse;
      }

      .preview-md-table th,
      .preview-md-table td {
        border: 1px solid var(--gh-border-default);
        padding: 6px 13px;
        text-align: left;
        vertical-align: top;
      }

      .preview-md-table th {
        background: var(--gh-bg-subtle);
        font-weight: 700;
      }

      .preview-md-divider {
        margin: 24px 0;
      }
    </style>
  </head>
  <body>
    <form class="root" id="url-form">
      <label class="label" for="url-input">GitHub file URL</label>
      <input id="url-input" placeholder="https://github.com/org/repo/blob/main/README.md" required />
      <div class="actions">
        <button type="submit">Create preview</button>
        <button class="secondary" id="refresh-button" type="button">Refresh preview</button>
      </div>
      <div class="status" id="status-line">Ready</div>
      <div class="result-meta" id="result-line">State: idle</div>
      <div class="progress-line" id="progress-line">Sync progress: 0%</div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="preview-panel">
        <div class="label">Preview</div>
        <div class="preview-text markdown-body" id="preview-text"></div>
      </div>
      <button class="link-button" id="toggle-details-button" type="button">Show details</button>
      <div class="details" id="details-line" data-open="false"></div>
      <div class="auth-panel" id="auth-panel" data-open="false">
        <div class="auth-title">Private file requires PAT</div>
        <div class="auth-copy" id="auth-copy"></div>
        <div class="auth-meta" id="auth-meta"></div>
        <label class="label" for="pat-input">Personal access token</label>
        <input id="pat-input" type="password" placeholder="ghp_xxx or github_pat_xxx" />
        <div class="actions">
          <button class="secondary" id="save-pat-button" type="button">Guardar PAT y reintentar</button>
          <button class="danger" id="forget-pat-button" type="button">Olvidar PAT fichero</button>
        </div>
      </div>
    </form>

    <script>
      parent.postMessage(
        {
          pluginMessage: {
            type: "ui-ready",
          },
        },
        "*"
      );

      window.addEventListener("beforeunload", () => {
        parent.postMessage(
          {
            pluginMessage: {
              type: "ui-closed",
            },
          },
          "*"
        );
      });

      const form = document.getElementById("url-form");
      const input = document.getElementById("url-input");
      const patInput = document.getElementById("pat-input");
      const submitButton = form.querySelector("button[type='submit']");
      const refreshButton = document.getElementById("refresh-button");
      const savePatButton = document.getElementById("save-pat-button");
      const forgetPatButton = document.getElementById("forget-pat-button");
      const statusLine = document.getElementById("status-line");
      const resultLine = document.getElementById("result-line");
      const toggleDetailsButton = document.getElementById("toggle-details-button");
      const detailsLine = document.getElementById("details-line");
      const authPanel = document.getElementById("auth-panel");
      const authCopy = document.getElementById("auth-copy");
      const authMeta = document.getElementById("auth-meta");
      const previewText = document.getElementById("preview-text");
      const progressLine = document.getElementById("progress-line");
      const progressFill = document.getElementById("progress-fill");
      let activeWidgetId = "active-widget";
      let activeAuthContext = null;
      let detailsOpen = false;
      let syncProgress = 0;

      const AUTH_MESSAGES = {
        MISSING_PAT:
          "El fichero que intentas visualizar es privado. Crea o pega un personal access token para continuar.",
        EXPIRED_PAT: "Tu personal access token es invalido o ha expirado.",
        CURRENT_PAT: "Tu personal access token no tiene permisos/scope suficiente.",
      };

      function updateDetailsVisibility() {
        detailsLine.dataset.open = detailsOpen ? "true" : "false";
        toggleDetailsButton.textContent = detailsOpen ? "Hide details" : "Show details";
      }

      function setStatus(level, message, details = "") {
        statusLine.textContent = message || "Ready";
        statusLine.className = `status ${level || ""}`.trim();
        detailsLine.textContent = details || "";
        if (!details) {
          detailsOpen = false;
        }
        updateDetailsVisibility();

        const isLoading = level === "loading";
        submitButton.disabled = isLoading;
        refreshButton.disabled = isLoading;
      }

      function setLastResult(lastResult, syncState) {
        const safe = lastResult && typeof lastResult === "object" ? lastResult : {};
        const status = safe.status || syncState || "idle";
        const mode = safe.mode || "manual";
        const message = safe.message ? ` · ${safe.message}` : "";
        resultLine.textContent = `State: ${status} (${mode})${message}`;
      }

      function setSyncProgress(rawPercent) {
        const percent = Number.isFinite(Number(rawPercent))
          ? Math.max(0, Math.min(100, Math.round(Number(rawPercent))))
          : 0;
        syncProgress = percent;
        progressLine.textContent = `Sync progress: ${percent}%`;
        progressFill.style.width = `${percent}%`;
      }

      function clearNodeChildren(node) {
        while (node.firstChild) {
          node.removeChild(node.firstChild);
        }
      }

      function appendPreviewNode(tagName, className, text) {
        const node = document.createElement(tagName);
        if (className) node.className = className;
        node.textContent = typeof text === "string" ? text : "";
        return node;
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function renderInlineLink(label, href) {
        const safeLabel = String(label || "");
        const safeHref = String(href || "").replace(/&amp;/g, "&");
        const isExternal =
          /^(https?:)?\/\//i.test(safeHref) || /^mailto:/i.test(safeHref);
        const attrs = isExternal ? ' target="_blank" rel="noreferrer"' : "";
        return `<a class="preview-md-link" href="${safeHref}"${attrs}>${safeLabel}</a>`;
      }

      function formatInlineMarkdownToHtml(value) {
        let html = escapeHtml(value);
        html = html.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;[^&]+&quot;)?\)/g, (_m, label, href) =>
          renderInlineLink(label, href)
        );
        html = html.replace(
          /&lt;((?:https?:\/\/|mailto:)[^&<>]+)&gt;/g,
          (_m, href) => renderInlineLink(href, href)
        );
        html = html.replace(
          /(^|[\s(>])((https?:\/\/[^\s<)]+))/g,
          (_m, prefix, href) => `${prefix}${renderInlineLink(href, href)}`
        );
        html = html.replace(/`([^`]+)`/g, '<code class="preview-inline-code">$1</code>');
        html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        html = html.replace(/__([^_]+)__/g, "<strong>$1</strong>");
        html = html.replace(/~~([^~]+)~~/g, "<del>$1</del>");
        html = html.replace(/(^|[^\*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
        html = html.replace(/(^|[^_])_([^_\n]+)_/g, "$1<em>$2</em>");
        html = html.replace(/\n/g, "<br/>");
        return html;
      }

      function appendMarkdownNode(tagName, className, text) {
        const node = document.createElement(tagName);
        if (className) node.className = className;
        node.innerHTML = formatInlineMarkdownToHtml(text);
        return node;
      }

      function parseMarkdownTableRow(line) {
        const normalized = String(line || "").trim().replace(/^\|/, "").replace(/\|$/, "");
        return normalized.split("|").map((cell) => cell.trim());
      }

      function buildTableNode(content) {
        const rawLines = String(content || "")
          .split(/\r?\n/)
          .map((line) => line.trim())
          .filter(Boolean);
        if (rawLines.length < 2) {
          return appendPreviewNode("pre", "preview-md-code", String(content || ""));
        }

        const header = parseMarkdownTableRow(rawLines[0]);
        const rows = rawLines.slice(2).map(parseMarkdownTableRow);
        const colCount = Math.max(1, header.length);

        const wrapper = document.createElement("div");
        wrapper.className = "preview-md-table-wrap";
        const table = document.createElement("table");
        table.className = "preview-md-table";
        const thead = document.createElement("thead");
        const headRow = document.createElement("tr");
        for (let i = 0; i < colCount; i += 1) {
          const th = document.createElement("th");
          th.innerHTML = formatInlineMarkdownToHtml(header[i] || "");
          headRow.appendChild(th);
        }
        thead.appendChild(headRow);
        table.appendChild(thead);

        const tbody = document.createElement("tbody");
        for (const rowCells of rows) {
          const tr = document.createElement("tr");
          for (let i = 0; i < colCount; i += 1) {
            const td = document.createElement("td");
            td.innerHTML = formatInlineMarkdownToHtml(rowCells[i] || "");
            tr.appendChild(td);
          }
          tbody.appendChild(tr);
        }
        table.appendChild(tbody);
        wrapper.appendChild(table);
        return wrapper;
      }

      function normalizeListItem(item) {
        if (item && typeof item === "object") {
          return {
            content: String(item.content || ""),
            depth: Math.max(1, Number(item.depth || 1)),
            task:
              item.task && typeof item.task === "object"
                ? { checked: Boolean(item.task.checked) }
                : null,
          };
        }
        return {
          content: String(item || ""),
          depth: 1,
          task: null,
        };
      }

      function buildListItemNode(item) {
        if (!item.task) {
          return appendMarkdownNode("li", "", item.content);
        }

        const li = document.createElement("li");
        li.className = "preview-md-task-item";

        const box = document.createElement("input");
        box.className = "preview-md-task-box";
        box.type = "checkbox";
        box.checked = Boolean(item.task.checked);
        box.disabled = true;
        li.appendChild(box);

        const label = document.createElement("span");
        label.className = "preview-md-task-label";
        label.innerHTML = formatInlineMarkdownToHtml(item.content);
        li.appendChild(label);

        return li;
      }

      function buildNestedListNode(items, ordered, start) {
        const listTag = ordered ? "ol" : "ul";
        const root = document.createElement(listTag);
        root.className = "preview-md-list";
        if (ordered) {
          const safeStart =
            Number.isFinite(Number(start)) && Number(start) > 0 ? Number(start) : 1;
          if (safeStart > 1) {
            root.start = safeStart;
          }
        }
        const stack = [{ depth: 1, list: root }];

        for (const rawItem of items) {
          const current = normalizeListItem(rawItem);
          let targetDepth = Math.max(1, current.depth);

          while (stack.length > targetDepth) {
            stack.pop();
          }

          while (stack.length < targetDepth) {
            const parent = stack[stack.length - 1].list;
            let parentLi = parent.lastElementChild;
            if (!parentLi) {
              parentLi = document.createElement("li");
              parent.appendChild(parentLi);
            }

            const nested = document.createElement(listTag);
            nested.className = "preview-md-list";
            parentLi.appendChild(nested);
            stack.push({ depth: stack.length + 1, list: nested });
          }

          stack[stack.length - 1].list.appendChild(buildListItemNode(current));
        }

        return root;
      }

      function setPreviewContent(payload) {
        const summary =
          typeof payload?.previewSummary === "string" ? payload.previewSummary.trim() : "";
        const previewKind =
          typeof payload?.previewKind === "string" ? payload.previewKind : "text";
        const previewBlocks = Array.isArray(payload?.previewBlocks) ? payload.previewBlocks : [];

        clearNodeChildren(previewText);

        if (previewKind === "markdown" && previewBlocks.length > 0) {
          const fragment = document.createDocumentFragment();

          for (const block of previewBlocks) {
            const type = typeof block?.type === "string" ? block.type : "text";

            if (type === "heading") {
              const depth = Math.max(1, Math.min(6, Number(block?.depth || 1)));
              const tag = `h${depth}`;
              fragment.appendChild(
                appendMarkdownNode(
                  tag,
                  `preview-md-heading preview-md-h${depth}`,
                  String(block?.content || "")
                )
              );
              continue;
            }

            if (type === "paragraph") {
              fragment.appendChild(
                appendMarkdownNode(
                  "p",
                  "preview-md-paragraph",
                  String(block?.content || "")
                )
              );
              continue;
            }

            if (type === "blockquote") {
              fragment.appendChild(
                appendMarkdownNode(
                  "blockquote",
                  "preview-md-blockquote",
                  String(block?.content || "")
                )
              );
              continue;
            }

            if (type === "list" && Array.isArray(block?.items)) {
              fragment.appendChild(
                buildNestedListNode(block.items, Boolean(block.ordered), block?.start)
              );
              continue;
            }

            if (type === "divider") {
              const hr = document.createElement("hr");
              hr.className = "preview-md-divider";
              fragment.appendChild(hr);
              continue;
            }

            if (type === "table") {
              fragment.appendChild(buildTableNode(block?.content || ""));
              continue;
            }

            if (type === "code" || type === "text" || type === "mermaid") {
              fragment.appendChild(
                appendPreviewNode("pre", "preview-md-code", String(block?.content || ""))
              );
              continue;
            }

            fragment.appendChild(
              appendPreviewNode(
                "p",
                "preview-md-paragraph",
                String(block?.content || "")
              )
            );
          }

          previewText.appendChild(fragment);
          return;
        }

        previewText.appendChild(
          appendPreviewNode("pre", "preview-empty", summary || "No preview yet.")
        );
      }

      function setAuthPanel(open, payload = null) {
        if (!open || !payload || typeof payload.sourceKey !== "string") {
          activeAuthContext = null;
          authPanel.dataset.open = "false";
          authCopy.textContent = "";
          authMeta.textContent = "";
          patInput.value = "";
          savePatButton.disabled = false;
          forgetPatButton.disabled = false;
          return;
        }

        activeAuthContext = payload;
        authPanel.dataset.open = "true";
        authCopy.textContent =
          payload.message || AUTH_MESSAGES[payload.code] || AUTH_MESSAGES.MISSING_PAT;
        authMeta.textContent = `sourceKey: ${payload.sourceKey}`;
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        setStatus("loading", "Syncing...");

        parent.postMessage(
          {
            pluginMessage: {
              type: "create-preview",
              url: input.value,
            },
          },
          "*"
        );
      });

      refreshButton.addEventListener("click", () => {
        setStatus("loading", "Syncing...");
        parent.postMessage(
          {
            pluginMessage: {
              type: "refresh-preview",
              widgetId: activeWidgetId,
            },
          },
          "*"
        );
      });

      toggleDetailsButton.addEventListener("click", () => {
        detailsOpen = !detailsOpen;
        updateDetailsVisibility();
      });

      savePatButton.addEventListener("click", () => {
        if (!activeAuthContext || typeof activeAuthContext.sourceKey !== "string") {
          setStatus("error", "No hay sourceKey para guardar PAT.");
          return;
        }

        const token = patInput.value.trim();
        if (!token) {
          setStatus("error", "Introduce un PAT valido para continuar.");
          return;
        }

        setStatus("loading", "Reintentando con PAT...");
        parent.postMessage(
          {
            pluginMessage: {
              type: "submit-pat",
              sourceKey: activeAuthContext.sourceKey,
              token,
            },
          },
          "*"
        );
      });

      forgetPatButton.addEventListener("click", () => {
        if (!activeAuthContext || typeof activeAuthContext.sourceKey !== "string") {
          setStatus("error", "No hay sourceKey para olvidar PAT.");
          return;
        }

        parent.postMessage(
          {
            pluginMessage: {
              type: "forget-pat",
              sourceKey: activeAuthContext.sourceKey,
            },
          },
          "*"
        );
      });

      window.onmessage = (event) => {
        const payload = event.data && event.data.pluginMessage;
        if (!payload || typeof payload.type !== "string") {
          return;
        }

        if (payload.type === "widget-context") {
          if (typeof payload.lastUrl === "string" && payload.lastUrl.length > 0) {
            input.value = payload.lastUrl;
          }

          if (typeof payload.widgetId === "string" && payload.widgetId.length > 0) {
            activeWidgetId = payload.widgetId;
          }

          if (typeof payload.status === "string" && payload.status.length > 0) {
            setStatus("", payload.status);
          }
          setLastResult(payload.lastResult, payload.syncState);
          setSyncProgress(payload.progressPercent);
          setPreviewContent(payload);

          if (payload.authContext && typeof payload.authContext === "object") {
            setAuthPanel(true, payload.authContext);
          } else {
            setAuthPanel(false);
          }
          return;
        }

        if (payload.type === "runtime-status") {
          setStatus(payload.level, payload.message, payload.details);
          setLastResult(payload.lastResult, payload.syncState);
          if (payload.level === "success" && payload.progressPercent == null) {
            setSyncProgress(100);
          } else if (payload.level === "error" && payload.progressPercent == null) {
            setSyncProgress(100);
          } else {
            setSyncProgress(payload.progressPercent);
          }
          setPreviewContent(payload);
          if (payload.authRequired && typeof payload.sourceKey === "string") {
            setAuthPanel(true, payload);
          } else if (payload.level === "success") {
            setAuthPanel(false);
          }
        }
      };

      setPreviewContent({});
      updateDetailsVisibility();
    </script>
  </body>
</html>
